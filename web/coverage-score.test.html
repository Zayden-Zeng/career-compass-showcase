<!doctype html><meta charset="utf-8"><title>Coverage score regression tests</title><script src="coverage-score.js?v=1"></script><pre id="results"></pre><script>
const C=CompassCoverage,results=[];
function test(name,fn){try{fn();results.push('PASS '+name)}catch(e){results.push('FAIL '+name+': '+e.message)}}
function eq(a,b){if(Math.abs(a-b)>1e-8)throw Error(a+' != '+b)}
const axes=[{A:1,B:1,S:.5},{A:1,C:1},{A:.5,D:1}];
test('multi-direction course contributes exactly one point',()=>eq(C.calculate(['A'],axes).total,1));
test('duplicate course is ignored',()=>eq(C.calculate(['A','A'],axes).total,1));
test('supporting-only course contributes half point',()=>eq(C.calculate(['S'],axes).total,.5));
test('unmapped course contributes zero',()=>eq(C.calculate(['Z'],axes).total,0));
test('adding any one course increases total by at most one',()=>{for(let mask=0;mask<32;mask++){const codes=['A','B','C','D','S'].filter((_,i)=>mask&(1<<i));for(const c of ['A','B','C','D','S']){const delta=C.calculate([...codes,c],axes).total-C.calculate(codes,axes).total;if(delta>1+1e-9||delta<0)throw Error('delta '+delta)}}});
test('removing then restoring a course restores exact score',()=>eq(C.calculate(['A','B'],axes).total,C.calculate(['B','A'],axes).total));
test('each direction caps at three',()=>{const a=[{A:1,B:1,C:1,D:1}];eq(C.calculate(['A','B','C','D'],a).counts[0],3)});
test('all six capped directions total eighteen',()=>{const a=Array.from({length:6},(_,i)=>Object.fromEntries([0,1,2].map(j=>['C'+i+j,1])));eq(C.calculate(a.flatMap(x=>Object.keys(x)),a).total,18)});
test('final badge cannot unlock below eighteen',()=>eq(C.level(17.99,[1,2,3,4,5,6,7,8,10,12,14,16,18]),12));
test('floating-point tolerance unlocks exact eighteen',()=>eq(C.level(18-1e-12,[1,2,3,4,5,6,7,8,10,12,14,16,18]),13));
test('format never rounds incomplete direction up to three',()=>{if(C.format(2.999)==='3')throw Error('rounded up')});
document.querySelector('#results').textContent=results.join('\n');
</script>
